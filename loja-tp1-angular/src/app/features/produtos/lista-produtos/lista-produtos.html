<section class="catalogo">
    <header class="barradetarefas">
        <h2>Catálogo</h2>
        <div class="acoes-header">
            <button class="btn sopromo" {class.ativo}="apenasPromo()" (click)="alternarPromo()">
                @if (apenasPromo()) {
                    Mostrar todos
                } @else {
                    Promoções
                }

            </button>

            <button class="btn primary" type="button" (click)="oncreateProduct('/produtos/novo')">
                + Novo Produto
            </button>
        </div>
    </header>

    @if(carregando()){
        <p>Carregando produtos....</p>
    }
    @else if(produtoExibidos().length == 0){
        <p class="vazio">Nenhum produto encontrado para ser exibido.</p>
    }@else {
        <div class="grid">
            @for (prod of produtoExibidos(); track prod.id) {
                <app-card-produto [produto]="prod" (add)="onAddProduct($event)" (view)="onViewProduct($event)"></app-card-produto>
            }
        </div>
    }
</section>
